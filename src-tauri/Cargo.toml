[package]
name = "finance-atlas"
version = "0.2.0"
description = "Local encrypted Finance Atlas desktop workspace"
authors = ["Finance Atlas"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
rfd = "0.17"
base64 = "0.22"
tempfile = "3"
uuid = "1"
tauri-plugin-single-instance = "2"
