name: Finance Atlas checks

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

jobs:
  web-and-api:
    runs-on: windows-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ATLAS_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: npm run test:browser
      - run: npm ci --prefix api
      - run: npm test --prefix api
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix api --omit=dev --audit-level=high

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -v
      - name: Audit the locked Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/atlas-pip-audit"
          "$RUNNER_TEMP/atlas-pip-audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/atlas-pip-audit/bin/pip-audit" -r requirements.txt --require-hashes --disable-pip --progress-spinner off

  container-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, agent]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --pull --tag finance-atlas-${{ matrix.service }}:ci ${{ matrix.service }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-atlas-${{ matrix.service }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'

  native:
    runs-on: windows-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: rustup update stable
      - run: npm ci
      - run: npm run desktop:build -- --debug --no-bundle
      - run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
      - run: node tests/desktop-smoke.mjs
